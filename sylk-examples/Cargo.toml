[package]
name = "sylk-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["launch", "devtools", "logger", "lib"] }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
sylk = { path = "../sylk" }

[features]
fullstack = ["dioxus/fullstack"]
web = ["fullstack", "dioxus/web"]
server = ["fullstack", "dioxus/server", "sylk/server", "dep:tokio", "dep:anyhow"]
standalone = ["sylk/standalone"]

[[example]]
name = "standalone"
required-features = ["standalone"]

[[example]]
name = "counter"
required-features = ["fullstack"]

[[example]]
name = "register"
required-features = ["fullstack"]

[[example]]
name = "resource"
required-features = ["fullstack"]

[[example]]
name = "server_events"
required-features = ["fullstack"]

[[example]]
name = "streaming"
required-features = ["fullstack"]

[[example]]
name = "websocket"
required-features = ["fullstack"]

[lints]
workspace = true
